<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<title>Mutual Funds Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#F8FAFC;--paper:#0B1120;--surface:#111A2E;--line:#182645;--brand:#00B386;--brand-soft:rgba(0,179,134,0.12);--up:#00E699;--down:#FF4D6D;--muted:#94A3B8;}
*{box-sizing:border-box;}
html,body{margin:0;width:100%;background:var(--paper);color:var(--ink);font-family:IBM Plex Sans,sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{width:100%;max-width:none;margin:0;padding:20px 24px 64px;}
.topbar{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px;}
.wordmark{font-family:Newsreader,serif;font-weight:600;font-size:22px;letter-spacing:-0.01em;}
.wordmark span{font-style:italic;color:var(--brand);}
.navbtns{display:flex;gap:10px;}
.navbtn{font-size:13px;padding:7px 14px;border-radius:3px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:inherit;color:var(--ink);text-decoration:none;}
.navbtn.primary{background:var(--brand);color:#000;border-color:var(--brand);font-weight:600;}
.pagehead{margin:20px 0 18px;}
.pagehead h1{font-family:Newsreader,serif;font-weight:600;font-size:26px;margin:0 0 6px;letter-spacing:-0.01em;}
.pagehead p{font-size:13.5px;color:var(--muted);margin:0;max-width:640px;line-height:1.5;}
.rail{display:flex;gap:0;border:1px solid var(--line);background:var(--surface);overflow-x:auto;}
.cat{flex:1 0 128px;min-width:128px;padding:14px 14px 12px;cursor:pointer;border-right:1px solid var(--line);position:relative;transition:background .12s;}
.cat:last-child{border-right:none;}
.cat:hover{background:var(--brand-soft);}
.cat.active{background:var(--brand-soft);}
.cat.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--brand);}
.cat-name{font-size:13.5px;font-weight:500;line-height:1.25;}
.cat-count{font-size:11px;color:var(--muted);margin-top:5px;font-family:IBM Plex Mono,monospace;}
.segrow{display:flex;align-items:center;justify-content:space-between;margin:16px 0 18px;flex-wrap:wrap;gap:12px;}
.chips{display:flex;gap:8px;}
.chip{font-size:12.5px;padding:6px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);transition:all .12s;}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:3px;min-width:220px;}
.search input{border:none;outline:none;font-family:inherit;font-size:13px;width:100%;background:transparent;color:var(--ink);}
.search input::placeholder{color:var(--muted);}
.search svg{flex:none;opacity:.5;}
.tabrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:12px;}
.tabs{display:flex;gap:8px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:6px;}
.tab{font-size:13.5px;padding:9px 18px;cursor:pointer;color:var(--muted);font-weight:500;border-radius:4px;background:transparent;border:none;font-family:inherit;transition:all .12s;}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--paper);background:var(--brand);}
.rightlinks{display:flex;gap:16px;}
.rightlinks a{font-size:12.5px;color:var(--muted);text-decoration:none;cursor:pointer;}
.rightlinks a:hover{color:var(--ink);}
.tablewrap{border:1px solid var(--line);background:var(--surface);overflow-x:auto;margin-top:4px;}
table{border-collapse:collapse;width:100%;min-width:2000px;}
thead th{text-align:right;font-size:11px;font-weight:500;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;background:#0D1526;}
thead th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;}
thead th:first-child{z-index:2;}
thead th .arrow{font-size:9px;margin-left:3px;opacity:.55;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;text-align:right;font-family:IBM Plex Mono,monospace;white-space:nowrap;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--brand-soft);}
tbody tr{cursor:pointer;}
.fundcell{display:flex;align-items:flex-start;gap:8px;min-width:190px;}
.fundname{font-size:13.5px;font-weight:500;}
.fundtag{font-size:10.5px;color:var(--muted);}
.score-track{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end;width:100%;}
.score-badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:12px;font-weight:600;}
.up{color:var(--up);}.down{color:var(--down);}
.star{color:var(--line);font-size:14px;cursor:pointer;flex:none;}
.star:hover{color:#E8B84B;}
.footnote{margin-top:14px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.catcards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0;}
.catcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;transition:all .15s;}
.catcard:hover,.catcard.active{border-color:var(--brand);background:var(--brand-soft);}
.catcard h3{font-size:14px;font-weight:600;margin:10px 0 8px;}
.catcard p{font-size:11px;color:var(--muted);margin:2px 0;}
.catcard .check{color:var(--brand);font-weight:600;}
@media(max-width:900px){.catcards{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.catcards{grid-template-columns:1fr;}table{min-width:1400px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="wordmark">GB <span>Screener</span></div>
    <div class="navbtns">
      <a class="navbtn" href="/">Dashboard</a>
      <button class="navbtn primary" onclick="location.reload()">Refresh</button>
    </div>
  </div>
  <div class="pagehead">
    <h1 id="pageTitle">Top Mutual Funds 2026</h1>
    <p id="pageDesc">Compare all mutual funds in this category based on Checklist Score, AUM, Net Expense Ratio and Risk vs Reward.</p>
  </div>
  <div class="catcards" id="catCards"></div>
  <div class="rail" id="rail"></div>
  <div class="segrow">
    <div class="chips" id="chips"></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search fund name">
    </div>
  </div>
  <div class="tabrow">
    <div class="tabs" id="tabs"></div>
    <div class="rightlinks">
      <a onclick="exportCSV()">Export CSV</a>
      <a href="/" style="color:var(--brand);">Dashboard</a>
    </div>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr id="theadRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="footnote">
    <span id="rowCount"></span>
    <span>Checklist score reflects AUM stability, expense ratio, consistency and portfolio quality</span>
  </div>
</div>
<script src="/screener.js"></script>
</body>
</html>
