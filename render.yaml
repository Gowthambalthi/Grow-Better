services:
  - type: web
    name: grow-better
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node Server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: GB03_SIDES
        value: short
      - key: GB_TICK_CAPTURE
        value: "1"
      - key: ANGEL_ENABLED
        value: "false"
      - key: GROWW_ENABLED
        value: "false"
