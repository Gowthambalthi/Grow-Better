syntax = "proto3";

enum Product {
  CNC = 0;
  MIS = 1;
  CO = 2;
  BO = 3;
  NRML = 4;
  ARB = 5;
  MTF = 6;
  UNKNOWN = 7;
}

enum EquityType {
  STOCKS = 0;
  FUTURE = 1;
  OPTION = 2;
  ETF = 3;
  INDEX = 4;
  BONDS = 5;
}

enum EquityAsset {
  ASSET_STOCKS = 0;
  ASSET_INDICES = 1;
}

enum Exchange {
  BSE = 0;
  NSE = 1;
  MCX = 2;
  MCXSX = 3;
  NCDEX = 4;
  GLOBAL = 5;
  US = 6;
}

message ExchangeLeg {
  double creditQuantity = 1;
  double creditPrice = 2;
  double debitQuantity = 3;
  double debitPrice = 4;
}

message PositionInfo {
  string symbolIsin = 1;
  ExchangeLeg BSE = 2;
  ExchangeLeg NSE = 3;
}

message SymbolInfo {
  int64 lastUpdateTimestamp = 1;
  string searchId = 2;
  Product product = 3;
  string contractId = 4;
  EquityType equityType = 5;
  string displayName = 6;
  string underlyingId = 7;
  int64 nseMarketLot = 8;
  int64 bseMarketLot = 9;
  EquityAsset underlyingAssetType = 10;
  int64 freezeQty = 11;
  Exchange exchange = 12;
}

message PositionDetail {
  SymbolInfo symbolData = 1;
  PositionInfo positionInfo = 2;
}
